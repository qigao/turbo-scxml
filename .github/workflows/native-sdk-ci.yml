          project="$RUNNER_TEMP/turboscxml-native-dependencies.csproj"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
          </Project>
          EOF
          (
            cd "$RUNNER_TEMP"
            dotnet add "$project" package Salts.Native
            dotnet add "$project" package SaltsUtils.Native
            dotnet add "$project" package CHttp.Native
          )
          dotnet restore "$project" --configfile "$config" --packages "$packages" --no-cache
          sdk_root() {
            local package="$1"
            local rid="$2"
            local roots=()
            local root
            while IFS= read -r root; do
              roots+=("$root")
            done < <(
              find "$packages/$package" -mindepth 3 -maxdepth 3 -type d \
                -path "*/sdk/$rid" -print
            )
            if [ "${#roots[@]}" -ne 1 ]; then
              printf 'expected exactly one restored %s SDK for %s, found %s\n' \
                "$package" "$rid" "${#roots[@]}" >&2
              return 1
            fi
            printf '%s' "${roots[0]}"
          }
          echo "SALTS_ROOT=$(sdk_root salts.native linux-x64)" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$(sdk_root saltsutils.native linux-x64)" >> "$GITHUB_ENV"
          echo "CHTTP_ROOT=$(sdk_root chttp.native linux-x64)" >> "$GITHUB_ENV"

      - name: Restore third-party dependencies from shared cache only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=. --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" --triplet x64-linux --x-feature=quickjs --only-binarycaching

      - name: Configure sanitizer build
        shell: bash
        run: |
          set -euo pipefail
          sanitizer_flags="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake -S . -B build/ci-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DBUILD_TESTING=ON \
            -DTURBOSCXML_ENABLE_VOICEXML_CMETA=ON \
            -DTURBOSCXML_ENABLE_CHTTP_RESOURCE=ON \
            -DTURBOSCXML_ENABLE_CHTTP_EVENT_IO=ON \
            -DTURBOSCXML_ENABLE_QUICKJS=ON \
            -DCMAKE_C_FLAGS="$sanitizer_flags" \
            -DCMAKE_CXX_FLAGS="$sanitizer_flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$sanitizer_flags" \
            -DCMAKE_SHARED_LINKER_FLAGS="$sanitizer_flags"

      - name: Build and run sanitizer tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cmake --build build/ci-sanitizers --parallel 2
          bash cmake/ci/run-sanitizer-tests.sh

  windows:
    name: Windows x64 released SDK
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore current published native SDK graph
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $config = Join-Path $env:RUNNER_TEMP "NuGet.Config"
          $packages = Join-Path $env:RUNNER_TEMP "turboscxml-native-sdks"
          $project = Join-Path $env:RUNNER_TEMP "turboscxml-native-dependencies.csproj"
          '<configuration><packageSources><clear /></packageSources></configuration>' | Set-Content -LiteralPath $config
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password $env:GITHUB_TOKEN --store-password-in-clear-text --configfile $config
          if ($LASTEXITCODE -ne 0) { throw "failed to configure NuGet source" }
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
          </Project>
          '@ | Set-Content -LiteralPath $project
          Push-Location $env:RUNNER_TEMP
          try {
            dotnet add $project package Salts.Native
            if ($LASTEXITCODE -ne 0) { throw "failed to resolve Salts.Native" }
            dotnet add $project package SaltsUtils.Native
            if ($LASTEXITCODE -ne 0) { throw "failed to resolve SaltsUtils.Native" }
            dotnet add $project package CHttp.Native
            if ($LASTEXITCODE -ne 0) { throw "failed to resolve CHttp.Native" }
          }
          finally {
            Pop-Location
          }
          dotnet restore $project --configfile $config --packages $packages --no-cache
          if ($LASTEXITCODE -ne 0) { throw "failed to restore native SDK graph" }
          function Get-RestoredSdkRoot([string]$packageName, [string]$rid) {
            $packageRoot = Join-Path $packages $packageName
            $roots = @(
              Get-ChildItem -LiteralPath $packageRoot -Directory |
                ForEach-Object { Join-Path $_.FullName "sdk\$rid" } |
                Where-Object { Test-Path -LiteralPath $_ -PathType Container }
            )
            if ($roots.Count -ne 1) {
              throw "expected exactly one restored $packageName SDK for $rid, found $($roots.Count)"
            }
            return ($roots[0] -replace '\\', '/')
          }
          $saltsRoot = Get-RestoredSdkRoot "salts.native" "windows-x64"
          $saltsUtilsRoot = Get-RestoredSdkRoot "saltsutils.native" "windows-x64"
          $chttpRoot = Get-RestoredSdkRoot "chttp.native" "windows-x64"
          "SALTS_ROOT=$saltsRoot" >> $env:GITHUB_ENV
          "SALTS_UTILS_ROOT=$saltsUtilsRoot" >> $env:GITHUB_ENV
          "CHTTP_ROOT=$chttpRoot" >> $env:GITHUB_ENV

      - name: Restore third-party dependencies from shared cache only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath vcpkg_installed) { Remove-Item -Recurse -Force vcpkg_installed }
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-manifest-root=. --x-install-root="$env:GITHUB_WORKSPACE\vcpkg_installed" --triplet x64-windows --x-feature=quickjs --only-binarycaching
          if ($LASTEXITCODE -ne 0) { throw "vcpkg cache-only restore failed" }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE\vcpkg_installed" -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_APPLOCAL_DEPS=OFF -DBUILD_TESTING=ON -DTURBOSCXML_ENABLE_VOICEXML_CMETA=ON -DTURBOSCXML_ENABLE_CHTTP_RESOURCE=ON -DTURBOSCXML_ENABLE_CHTTP_EVENT_IO=ON -DTURBOSCXML_ENABLE_QUICKJS=ON -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\stage\turboscxml"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build/ci --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          $env:PATH = "$env:SALTS_ROOT\bin;$env:SALTS_UTILS_ROOT\bin;$env:CHTTP_ROOT\bin;$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build/ci -C Release --no-tests=error --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "CTest failed" }

      - name: Install and verify installed consumers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --install build/ci --config Release
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          $env:TURBOSCXML_ROOT = "$env:GITHUB_WORKSPACE\stage\turboscxml"
          $env:PATH = "$env:TURBOSCXML_ROOT\bin;$env:SALTS_ROOT\bin;$env:SALTS_UTILS_ROOT\bin;$env:CHTTP_ROOT\bin;$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows\bin;$env:PATH"
          cmake -S tests/install_consumer -B build/consumer-chttp -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE\vcpkg_installed" -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_APPLOCAL_DEPS=OFF -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_CHTTP_RESOURCE=ON -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_VOICEXML_CHTTP_RESOURCE=ON -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_CHTTP_EVENT_IO=ON -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_PLUGIN=ON -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_VOICEXML_DIALOG_MANAGER=ON -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_VOICEXML_DOCUMENT_STORE=ON
          if ($LASTEXITCODE -ne 0) { throw "CHTTP consumer configure failed" }
          cmake --build build/consumer-chttp --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "CHTTP consumer build failed" }
          cmake -S tests/install_consumer -B build/consumer-wide -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE\vcpkg_installed" -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_APPLOCAL_DEPS=OFF -DTURBOSCXML_INSTALL_CONSUMER_NO_COMPONENTS=ON
          if ($LASTEXITCODE -ne 0) { throw "wide consumer configure failed" }
          cmake --build build/consumer-wide --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "wide consumer build failed" }
          cmake -S tests/install_consumer -B build/consumer-voicexml-quickjs -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE\vcpkg_installed" -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_APPLOCAL_DEPS=OFF -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_VOICEXML_QUICKJS=ON
          if ($LASTEXITCODE -ne 0) { throw "VoiceXMLQuickJS consumer configure failed" }
          cmake --build build/consumer-voicexml-quickjs --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "VoiceXMLQuickJS consumer build failed" }

