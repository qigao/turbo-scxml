name: Native SDK CI

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "vcpkg.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "README.md"
      - ".github/workflows/native-sdk-ci.yml"
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "vcpkg.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "README.md"
      - ".github/workflows/native-sdk-ci.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: turboscxml-native-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 released SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm

      - name: Restore current published native SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/NuGet.Config"
          packages="$RUNNER_TEMP/turboscxml-native-sdks"
          project="$RUNNER_TEMP/turboscxml-native-dependencies.csproj"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
          </Project>
          EOF
          (
            cd "$RUNNER_TEMP"
            dotnet add "$project" package Salts.Native
            dotnet add "$project" package SaltsUtils.Native
            dotnet add "$project" package CHttp.Native
          )
          dotnet restore "$project" --configfile "$config" --packages "$packages" --no-cache
          sdk_root() {
            local package="$1"
            local rid="$2"
            local roots=()
            local root
            while IFS= read -r root; do
              roots+=("$root")
            done < <(
              find "$packages/$package" -mindepth 3 -maxdepth 3 -type d \
                -path "*/sdk/$rid" -print
            )
            if [ "${#roots[@]}" -ne 1 ]; then
              printf 'expected exactly one restored %s SDK for %s, found %s\n' \
                "$package" "$rid" "${#roots[@]}" >&2
              return 1
            fi
            printf '%s' "${roots[0]}"
          }
          echo "SALTS_ROOT=$(sdk_root salts.native linux-x64)" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$(sdk_root saltsutils.native linux-x64)" >> "$GITHUB_ENV"
          echo "CHTTP_ROOT=$(sdk_root chttp.native linux-x64)" >> "$GITHUB_ENV"

      - name: Restore third-party dependencies from shared cache only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=. --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" --triplet x64-linux --x-feature=quickjs --only-binarycaching

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" -DVCPKG_MANIFEST_MODE=OFF -DBUILD_TESTING=ON -DTURBOSCXML_ENABLE_VOICEXML_CMETA=ON -DTURBOSCXML_ENABLE_CHTTP_RESOURCE=ON -DTURBOSCXML_ENABLE_CHTTP_EVENT_IO=ON -DTURBOSCXML_ENABLE_QUICKJS=ON -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage/turboscxml"

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/ci --parallel 2
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$CHTTP_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/ci --no-tests=error --output-on-failure

      - name: Qualify supported VoiceXML option profiles
        shell: bash
        run: bash cmake/ci/qualify-voicexml-profiles.sh

      - name: Qualify Plugin-disabled core package
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/ci-no-plugin -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DBUILD_TESTING=ON \
            -DTURBOSCXML_ENABLE_PLUGIN=OFF \
            -DTURBOSCXML_ENABLE_VOICEXML_CMETA=ON \
            -DTURBOSCXML_ENABLE_CHTTP_RESOURCE=OFF \
            -DTURBOSCXML_ENABLE_CHTTP_EVENT_IO=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage/turboscxml-no-plugin"
          cmake --build build/ci-no-plugin --parallel 2
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/ci-no-plugin --no-tests=error --output-on-failure
          cmake --install build/ci-no-plugin
          export TURBOSCXML_ROOT="$GITHUB_WORKSPACE/stage/turboscxml-no-plugin"
          cmake -S tests/install_consumer -B build/consumer-no-plugin -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DTURBOSCXML_INSTALL_CONSUMER_NO_COMPONENTS=ON \
            -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_PLUGIN_MISSING=ON \
            -DTURBOSCXML_INSTALL_CONSUMER_FORBID_QJS_DISCOVERY=ON
          cmake --build build/consumer-no-plugin --parallel 2

      - name: Install and verify installed consumers
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/ci
          export TURBOSCXML_ROOT="$GITHUB_WORKSPACE/stage/turboscxml"
          export LD_LIBRARY_PATH="$TURBOSCXML_ROOT/lib:$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$CHTTP_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake -S tests/install_consumer -B build/consumer-chttp -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" -DVCPKG_MANIFEST_MODE=OFF -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_CHTTP_RESOURCE=ON -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_VOICEXML_CHTTP_RESOURCE=ON -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_CHTTP_EVENT_IO=ON -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_PLUGIN=ON -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_VOICEXML_DIALOG_MANAGER=ON -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_VOICEXML_DOCUMENT_STORE=ON
          cmake --build build/consumer-chttp --parallel 2
          cmake -S tests/install_consumer -B build/consumer-wide -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" -DVCPKG_MANIFEST_MODE=OFF -DTURBOSCXML_INSTALL_CONSUMER_NO_COMPONENTS=ON
          cmake --build build/consumer-wide --parallel 2
          cmake -S tests/install_consumer -B build/consumer-voicexml-quickjs -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" -DVCPKG_MANIFEST_MODE=OFF -DTURBOSCXML_INSTALL_CONSUMER_EXPECT_VOICEXML_QUICKJS=ON
          cmake --build build/consumer-voicexml-quickjs --parallel 2


  linux-sanitizers:
    name: Linux x64 ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
