name: ACE source SDK cutover conformance
# Separate, non-publishing development qualification against a source-built
# single-owner Unicode SDK pair. The published-package conformance workflow
# remains authoritative for release admission and MUST fail on duplicate exports.
'on':
  push:
    branches:
      - feature/ace23-cnet-ingress
    paths:
      - .github/workflows/ace-source-sdk-candidate.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turboscxml-ace-source-cutover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-source-candidate:
    if: github.repository == 'qigao/turbo-scxml'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      QIGAO_SDK_RID: linux-x64
      QIGAO_TARGET_TRIPLET: x64-linux
      QIGAO_HOST_TRIPLET: x64-linux
      QIGAO_NUGET_PACKAGES: ${{ github.workspace }}/stage/nuget
      CCACHE_DIR: ${{ github.workspace }}/.cache/ace-source-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      SALTS_UTILS_COMPILER_CACHE_NAMESPACE: turboscxml-ace-unicode-source
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout exact TurboSCXML consumer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout reviewed SaltsUtils Unicode cutover candidate
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: b9a896e5f1b2a53ac9109b7b4a958c64da912b5b
          path: candidate/salts-utils
          persist-credentials: false

      - name: Checkout released Salts RC2 source without fetching SDK packages
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 081bdff4da141c8042faa83aff0d25eae1077d5e
          path: candidate/salts-utils/candidate/salts-source
          persist-credentials: false

      - name: Restore canonical host re2c tool
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Configure existing read-only vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@fafb1efe5ac2440bfd7a08e493988d0459d89e51
        with:
          mode: read

      - name: Prepare canonical Salts native build tools
        uses: ./candidate/salts-utils/candidate/salts-source/.github/actions/setup-build-host

      - name: Restore Salts compiler cache
        uses: ./candidate/salts-utils/candidate/salts-source/.github/actions/setup-compiler-cache
        with:
          profile: turboscxml-ace-source-cutover

      - name: Prepare SaltsUtils native build tools
        uses: ./candidate/salts-utils/.github/actions/setup-build-host

      - name: Install Salts RC2 source into isolated candidate SDK
        shell: bash
        working-directory: candidate/salts-utils/candidate/salts-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 081bdff4da141c8042faa83aff0d25eae1077d5e
          cmake --preset linux-release-ci
          cmake --build --preset linux-release-ci --parallel 2
          cmake --build --preset install-linux-release-ci --parallel 2
          prefix="$GITHUB_WORKSPACE/candidate/salts-utils/candidate/salts-source/stage/sdk/linux-x64"
          test -f "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          echo "SALTS_ROOT=$prefix" >> "$GITHUB_ENV"
          echo "SALTS_HOST_ROOT=$prefix" >> "$GITHUB_ENV"

      - name: Build and install SaltsUtils cutover into the SAME SDK prefix
        shell: bash
        working-directory: candidate/salts-utils
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b9a896e5f1b2a53ac9109b7b4a958c64da912b5b
          cmake --preset ci-unicode-candidate-user
          cmake --build --preset ci-unicode-candidate-user --parallel 2
          ctest --preset ci-unicode-candidate-user --no-tests=error \
            --output-on-failure --parallel 2
          cmake --build --preset install-ci-unicode-candidate-user --parallel 2
          echo "SALTS_UTILS_ROOT=$SALTS_ROOT" >> "$GITHUB_ENV"
          echo "DATABIND_ROOT=$SALTS_ROOT" >> "$GITHUB_ENV"

      - name: Prove exactly one installed Unicode owner and record identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ace-source-acceptance
          salts_targets="$SALTS_ROOT/lib/cmake/Salts/SaltsTargets.cmake"
          utils_targets="$SALTS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsTargets.cmake"
          test -f "$salts_targets"
          test -f "$utils_targets"
          grep -Eq '^[[:space:]]*add_library\(Salts::Unicode[[:space:]]' "$salts_targets"
          if grep -Eq '^[[:space:]]*add_library\(Salts::Unicode[[:space:]]' "$utils_targets"; then
            echo "::error::Candidate still exports two Salts::Unicode owners"
            exit 1
          fi
          {
            printf 'consumer_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'salts_sha=%s\n' "$(git -C candidate/salts-utils/candidate/salts-source rev-parse HEAD)"
            printf 'saltsutils_sha=%s\n' "$(git -C candidate/salts-utils rev-parse HEAD)"
            printf 'rid=linux-x64\nprofile=source-installed\n'
            printf 'release_qualified=false\npublished_packages=false\n'
          } | tee build/ace-source-acceptance/identities.txt

      - name: Qualify TurboSCXML against the installed source SDK graph
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          cmake --preset ci-component-release-user
          cmake --build --preset ci-component-release-user --parallel 2
          ctest --preset ci-component-release-user \
            -R '^(scxml_component_test|scxml_component_dso_test|scxml_provider_test|scxml_plugin_test|scxml_test|scxml_event_io_contract_test|scxml_invoke_child_materialization_test|scxml_cnet_ingress_test|scxml_cnet_egress_test|scxml_host_router_test|scxml_cnet_frame_ingress_test|scxml_host_event_io_test|scxml_host_delay_test|scxml_cnet_domain_fence_test|scxml_cnet_request_generation_test|scxml_component_cnet_invoke_test)$' \
            --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/ace-source-acceptance/runtime.xml"
          cmake --build --preset install-ci-component-release-user --parallel 2

      - name: Qualify independent installed TurboSCXML C11/C++17 consumers
        shell: bash
        working-directory: tests/install_consumer
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build/component-runtime/bin:$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          cmake --preset ci-component-installed-user
          cmake --build --preset ci-component-installed-user --parallel 2
          ctest --preset ci-component-installed-user \
            --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/ace-source-acceptance/consumer.xml"

      - name: Record source-candidate scope
        if: always()
        shell: bash
        run: |
          mkdir -p build/ace-source-acceptance
          {
            echo '### ACE SDK source candidate — NOT a release graph'
            echo "Consumer commit: $GITHUB_SHA"
            echo 'Salts source: 081bdff4da141c8042faa83aff0d25eae1077d5e'
            echo 'SaltsUtils source: b9a896e5f1b2a53ac9109b7b4a958c64da912b5b'
            echo 'This job builds from immutable sources; it neither fetches nor republishes native NuGet SDK packages.'
            echo 'Released-package CI must remain red until SaltsUtils publishes a matching single-owner Unicode SDK.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain candidate qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboscxml-ace-source-candidate-linux
          path: |
            build/ace-source-acceptance/
            build/component-runtime/Testing/Temporary/LastTest.log
            tests/install_consumer/build/component-installed/Testing/Temporary/LastTest.log
          if-no-files-found: warn
