name: Component runtime conformance

on:
  pull_request:
    branches:
      - feature/component-runtime-conformance
    paths:
      - ".github/workflows/component-runtime-conformance.yml"
      - "CMakeLists.txt"
      - "CMakeUserPresets.json"
      - "cmake/**"
      - "presets/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "vcpkg.json"
  push:
    branches:
      - feature/component-runtime-conformance
    paths:
      - ".github/workflows/component-runtime-conformance.yml"
      - "CMakeLists.txt"
      - "CMakeUserPresets.json"
      - "cmake/**"
      - "presets/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "vcpkg.json"
  workflow_dispatch:

permissions:
  actions: read # access the exact Salts 2.3 Actions artifact, never fallback
  contents: read
  packages: read

concurrency:
  group: turbo-scxml-component-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Independent from Native SDK released-graph and sanitizer caches.
      CCACHE_DIR: ${{ github.workspace }}/.turboscxml-component-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout TurboSCXML integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore ccache compiler objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.turboscxml-component-ccache
          key: turboscxml-component-ccache-linux-x64-v1-${{ hashFiles('CMakeLists.txt', 'CMakeUserPresets.json', 'vcpkg.json', 'presets/*.json', '.github/workflows/component-runtime-conformance.yml') }}-${{ github.sha }}
          restore-keys: |
            turboscxml-component-ccache-linux-x64-v1-${{ hashFiles('CMakeLists.txt', 'CMakeUserPresets.json', 'vcpkg.json', 'presets/*.json', '.github/workflows/component-runtime-conformance.yml') }}-
            turboscxml-component-ccache-linux-x64-v1-

      - name: Restore Salts host re2c
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config ccache
          command -v ccache
          ccache --zero-stats

      # Fail closed: only the exact published prerelease and attested source SHA are valid.
      # Never check out, compile or fall back to a stable Salts tree here.
      # Exact run-scoped unmerged 2.3 SDK; no GitHub Packages fallback.
      - name: Restore and attest ACE 2.3 SDK from Salts Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SALTS_CANDIDATE_VERSION: '2.3.0-ace.shad154d61cc329f4dc70c084b386c1247b5dddbc0c'
          SALTS_CANDIDATE_SHA: 'd154d61cc329f4dc70c084b386c1247b5dddbc0c'
          SALTS_RUN_ID: '37880183154'
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          tmp="$RUNNER_TEMP/salts-ace-candidate"
          mkdir -p "$tmp/artifact" "$tmp/nuget"
          test "$(gh api "repos/qigao/salts/actions/runs/$SALTS_RUN_ID" --jq .head_sha)" = "$SALTS_CANDIDATE_SHA"
          test "$(gh api "repos/qigao/salts/actions/runs/$SALTS_RUN_ID" --jq .conclusion)" = success
          gh run download "$SALTS_RUN_ID" -R qigao/salts -n salts-native-ace-candidate-linux-x64 -D "$tmp/artifact"
          sums="$(find "$tmp/artifact" -type f -name SHA256SUMS -print -quit)"
          test -n "$sums"
          nupkg="$(find "$tmp/artifact" -type f -name "Salts.Native.$SALTS_CANDIDATE_VERSION.nupkg" -print -quit)"
          test -n "$nupkg"
          expected="$(awk -v base="$(basename "$nupkg")" '$2==base || $2=="dist/"base {print $1}' "$sums")"
          [[ "$expected" =~ ^[[:xdigit:]]{64}$ ]]
          test "$(sha256sum "$nupkg" | awk '{print $1}')" = "$expected"
          python3 - "$nupkg" "$tmp/nuget" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
          PY
          root="$tmp/nuget/sdk/linux-x64"
          manifest="$root/salts-sdk-manifest.txt"
          test -f "$root/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$root/include/salts/component_plugin.h"
          test -f "$root/include/salts/component.h"
          test -f "$manifest"
          grep -Fxq "version=$SALTS_CANDIDATE_VERSION" "$manifest"
          grep -Fxq "commit=$SALTS_CANDIDATE_SHA" "$manifest"
          grep -Fxq 'rid=linux-x64' "$manifest"
          grep -Fxq 'profile=ace-2.3-candidate' "$manifest"
          grep -Fq 'Salts::ComponentPlugin' "$root/lib/cmake/Salts/SaltsTargets.cmake"
          previous_salts_root="${SALTS_ROOT:-}"
          ld_path="$root/lib"
          IFS=':' read -r -a ld_entries <<< "${LD_LIBRARY_PATH:-}"
          for entry in "${ld_entries[@]}"; do
            if [ -n "$entry" ] && [ "$entry" != "$previous_salts_root/lib" ] && [ "$entry" != "$previous_salts_root/bin" ]; then
              ld_path="$ld_path:$entry"
            fi
          done
          echo "SALTS_ROOT=$root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$ld_path" >> "$GITHUB_ENV"
          echo "SALTS_CANDIDATE_SHA256=$expected" >> "$GITHUB_ENV"
          echo "Selected exact run $SALTS_RUN_ID Salts.Native $SALTS_CANDIDATE_VERSION ($expected)"
          
      - name: Checkout SaltsUtils dependency source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: 1c00cab3c5fe4722d4c8488a47f0ada6ec2f3e6b
          path: _deps/salts-utils
          persist-credentials: false

      - name: Rebuild SaltsUtils against the exact candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QIGAO_TARGET_TRIPLET: x64-linux
          QIGAO_SDK_RID: linux-x64
        working-directory: _deps/salts-utils
        run: |
          set -euo pipefail
          cmake --preset ci-sdk-release-user
          cmake --build --preset ci-sdk-release-user -j2
          cmake --build --preset install-ci-sdk-release-user -j2
          root="$GITHUB_WORKSPACE/_deps/salts-utils/stage/sdk/linux-x64"
          printf 'source=%s\nsalts_commit=%s\nsalts_package_sha256=%s\nrid=linux-x64\nprofile=release\n' \
            "$(git rev-parse HEAD)" "d154d61cc329f4dc70c084b386c1247b5dddbc0c" "$SALTS_CANDIDATE_SHA256" > "$root/component-dependency-manifest.txt"
          echo "SALTS_UTILS_ROOT=$root" >> "$GITHUB_ENV"
          echo "DATABIND_ROOT=$root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib:$root/bin:$SALTS_ROOT/lib" >> "$GITHUB_ENV"

      - name: Configure the complete conformance graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cmake --preset ci-component-release-user

      - name: Build the complete conformance graph
        run: cmake --build --preset ci-component-release-user -j2

      - name: Run Component and adjacent business tests
        run: >-
          ctest --preset ci-component-release-user
          -R '^(scxml_component_test|scxml_component_dso_test|scxml_provider_test|scxml_plugin_test|scxml_test|scxml_event_io_contract_test|scxml_invoke_child_materialization_test)$'
          --no-tests=error --output-on-failure
          --output-junit "$GITHUB_WORKSPACE/build/component-runtime/component-results.xml"

      - name: Install the qualified consumer SDK
        run: cmake --build --preset install-ci-component-release-user -j2

      - name: Verify the installed SDK consumer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: tests/install_consumer
        run: |
          set -euo pipefail
          cmake --preset ci-component-installed-user
          cmake --build --preset ci-component-installed-user -j2
          ctest --preset ci-component-installed-user --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/component-runtime/installed-results.xml"

      - name: Record ccache statistics
        if: always()
        shell: bash
        run: |
          mkdir -p build/component-runtime
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats | tee build/component-runtime/ccache-stats.txt
          else
            printf 'ccache tool unavailable before build\n' > build/component-runtime/ccache-stats.txt
          fi

      - name: Record acceptance identities
        if: always()
        shell: bash
        run: |
          mkdir -p build/component-runtime
          printf 'consumer_commit=%s\nsalts_commit=%s\nsalts_package_sha256=%s\n' \
            "$(git rev-parse HEAD)" "d154d61cc329f4dc70c084b386c1247b5dddbc0c" "$SALTS_CANDIDATE_SHA256" > build/component-runtime/acceptance.txt
          if [ -n "${SALTS_UTILS_ROOT:-}" ]; then
            printf 'dependency=SaltsUtils\n' >> build/component-runtime/acceptance.txt
            cat "$SALTS_UTILS_ROOT/component-dependency-manifest.txt" >> build/component-runtime/acceptance.txt
          fi

          printf 'runner_os=%s\nrunner_arch=%s\ncompiler=%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$(gcc -dumpfullversion)" >> build/component-runtime/acceptance.txt

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-acceptance-linux-x64
          path: |
            build/component-runtime/acceptance.txt
            build/component-runtime/ccache-stats.txt
            build/component-runtime/component-results.xml
            build/component-runtime/installed-results.xml
            build/component-runtime/Testing/Temporary/LastTest.log
            tests/install_consumer/build/component-installed/Testing/Temporary/LastTest.log
