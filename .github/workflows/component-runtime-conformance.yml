name: Component runtime conformance

on:
  push:
    branches:
      - feature/component-runtime-conformance
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turbo-scxml-component-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout TurboSCXML integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/component-runtime-conformance
          fetch-depth: 2
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore Salts host re2c
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Restore published SaltsUtils SDK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          config="$RUNNER_TEMP/NuGet.Config"
          packages="$RUNNER_TEMP/turboscxml-component-sdks"
          project="$RUNNER_TEMP/turboscxml-component-dependencies.csproj"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
          </Project>
          EOF
          dotnet add "$project" package SaltsUtils.Native
          dotnet restore "$project" --configfile "$config"             --packages "$packages" --no-cache

          roots=()
          while IFS= read -r root; do roots+=("$root"); done < <(
            find "$packages/saltsutils.native" -mindepth 3 -maxdepth 3               -type d -path '*/sdk/linux-x64' -print
          )
          test "${#roots[@]}" -eq 1
          echo "SALTS_UTILS_ROOT=${roots[0]}" >> "$GITHUB_ENV"

      # Fail closed: only the exact published prerelease and attested source SHA are valid.
      # Never check out, compile or fall back to a stable Salts tree here.
      - name: Restore exact Salts.Native Component candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SALTS_CANDIDATE_VERSION: '2.1.2-cmeta.f235fa23b09547d65bb99f15f00b0220b4920820'
          SALTS_CANDIDATE_SHA: 'f235fa23b09547d65bb99f15f00b0220b4920820'
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          config="$RUNNER_TEMP/salts-component-candidate.nuget.config"
          project="$RUNNER_TEMP/salts-component-candidate.csproj"
          packages="$RUNNER_TEMP/salts-component-candidate-packages"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="[$SALTS_CANDIDATE_VERSION]" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --configfile "$config" --packages "$packages" \
            --no-cache --force-evaluate
          root="$packages/salts.native/$SALTS_CANDIDATE_VERSION/sdk/linux-x64"
          manifest="$root/salts-sdk-manifest.txt"
          test -f "$root/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$root/include/salts/component_plugin.h"
          test -f "$root/include/salts/component.h"
          test -f "$manifest"
          grep -Fxq "version=$SALTS_CANDIDATE_VERSION" "$manifest"
          grep -Fxq "commit=$SALTS_CANDIDATE_SHA" "$manifest"
          grep -Fxq 'rid=linux-x64' "$manifest"
          grep -Fxq 'profile=candidate' "$manifest"
          grep -Fq 'Salts::ComponentPlugin' "$root/lib/cmake/Salts/SaltsTargets.cmake"

          # Existing dependency-graph restore may have installed a stable Salts.
          # Remove that runtime path so it cannot serve as an implicit fallback.
          previous_salts_root="${SALTS_ROOT:-}"
          ld_path="$root/lib"
          IFS=':' read -r -a ld_entries <<< "${LD_LIBRARY_PATH:-}"
          for entry in "${ld_entries[@]}"; do
            if [ -n "$entry" ] && [ "$entry" != "$previous_salts_root/lib" ] &&
               [ "$entry" != "$previous_salts_root/bin" ]; then
              ld_path="$ld_path:$entry"
            fi
          done
          echo "SALTS_ROOT=$root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$ld_path" >> "$GITHUB_ENV"
          echo "Selected exact Salts.Native $SALTS_CANDIDATE_VERSION ($SALTS_CANDIDATE_SHA)"
          
      - name: Configure focused TurboSCXML Component profile
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/component-runtime -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DBUILD_TESTING=ON             -DTURBOSCXML_ENABLE_COMPONENT=ON             -DTURBOSCXML_ENABLE_PLUGIN=OFF             -DTURBOSCXML_ENABLE_QUICKJS=OFF             -DTURBOSCXML_ENABLE_VOICEXML_CMETA=OFF             -DTURBOSCXML_ENABLE_CHTTP_RESOURCE=OFF             -DTURBOSCXML_ENABLE_CHTTP_EVENT_IO=OFF             -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_MANIFEST_MODE=OFF

      - name: Build Component provider conformance
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/component-runtime --target             scxml_component_test -j2

      - name: Run Component provider conformance
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/component-runtime             -R '^scxml_component_test$'             --no-tests=error --output-on-failure

      - name: Verify exact integration branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/component-runtime-conformance"
