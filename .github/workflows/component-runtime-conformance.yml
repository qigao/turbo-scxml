name: Component runtime conformance

on:
  pull_request:
    branches:
      - feature/component-runtime-conformance
    paths:
      - ".github/workflows/component-runtime-conformance.yml"
      - "CMakeLists.txt"
      - "CMakeUserPresets.json"
      - "cmake/**"
      - "presets/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "vcpkg.json"
  push:
    branches:
      - feature/component-runtime-conformance
    paths:
      - ".github/workflows/component-runtime-conformance.yml"
      - "CMakeLists.txt"
      - "CMakeUserPresets.json"
      - "cmake/**"
      - "presets/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "vcpkg.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turbo-scxml-component-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Independent from Native SDK released-graph and sanitizer caches.
      CCACHE_DIR: ${{ github.workspace }}/.turboscxml-component-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout TurboSCXML integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore ccache compiler objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.turboscxml-component-ccache
          key: turboscxml-component-ccache-linux-x64-v1-${{ hashFiles('CMakeLists.txt', 'CMakeUserPresets.json', 'vcpkg.json', 'presets/*.json', 'cmake/ci/native-sdk-dependencies.csproj', '.github/workflows/component-runtime-conformance.yml') }}-${{ github.sha }}
          restore-keys: |
            turboscxml-component-ccache-linux-x64-v1-${{ hashFiles('CMakeLists.txt', 'CMakeUserPresets.json', 'vcpkg.json', 'presets/*.json', 'cmake/ci/native-sdk-dependencies.csproj', '.github/workflows/component-runtime-conformance.yml') }}-
            turboscxml-component-ccache-linux-x64-v1-

      - name: Restore Salts host re2c
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config ccache
          command -v ccache
          ccache --zero-stats

      # Consume the same source-tested, published RC SDK graph as the native matrix.
      # No SDK source checkout, one-off Actions candidate or stable-version fallback.
      - name: Restore and verify Salts 2.3 / SaltsUtils 4.3 NuGet prereleases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/NuGet.Config"
          packages="$RUNNER_TEMP/turboscxml-component-sdks"
          project="$RUNNER_TEMP/turboscxml-component-dependencies.csproj"
          mkdir -p build/component-runtime
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          cp cmake/ci/native-sdk-dependencies.csproj "$project"
          dotnet restore "$project" --configfile "$config" --packages "$packages" --no-cache

          sdk_root() {
            local package="$1" version_prefix="$2" rid="$3"
            local roots=() path version
            while IFS= read -r path; do roots+=("$path"); done < <(
              find "$packages/$package" -mindepth 3 -maxdepth 3 -type d -path "*/sdk/$rid" -print
            )
            if [ "${#roots[@]}" -ne 1 ]; then
              echo "Expected exactly one $package SDK for $rid, got ${#roots[@]}" >&2
              return 1
            fi
            version="$(basename "$(dirname "$(dirname "${roots[0]}")")")"
            case "$version" in "$version_prefix"-*) ;; *)
              echo "Rejected $package $version: expected $version_prefix prerelease" >&2
              return 1 ;;
            esac
            printf '%s' "${roots[0]}"
          }

          salts_root="$(sdk_root salts.native 2.3.0 linux-x64)"
          utils_root="$(sdk_root saltsutils.native 4.3.0 linux-x64)"
          salts_version="$(basename "$(dirname "$(dirname "$salts_root")")")"
          utils_version="$(basename "$(dirname "$(dirname "$utils_root")")")"
          salts_manifest="$salts_root/salts-sdk-manifest.txt"
          utils_manifest="$utils_root/salts-utils-sdk-manifest.txt"
          for manifest in "$salts_manifest" "$utils_manifest"; do
            test -f "$manifest" || { echo "Missing SDK manifest: $manifest" >&2; exit 1; }
            echo "Validating resolved SDK manifest: $manifest"
            grep -E '^(version|commit|profile|rid)=' "$manifest" || true
            grep -Fxq 'profile=release' "$manifest" || { echo "SDK profile must be release" >&2; exit 1; }
            grep -Eq '^commit=[[:xdigit:]]{40}' "$manifest" || { echo "Invalid SDK source SHA in $manifest" >&2; exit 1; }
          done
          grep -Fq "version=$salts_version" "$salts_manifest"
          grep -Fq "version=$utils_version" "$utils_manifest"
          test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$salts_root/include/salts/component_plugin.h"
          test -f "$utils_root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          grep -Fq 'Salts::ComponentPlugin' "$salts_root/lib/cmake/Salts/SaltsTargets.cmake"

          # Record the concrete NuGet versions and immutable source SHAs selected
          # by the requested floating ranges for review and eventual exact pins.
          {
            printf 'salts_package=%s\n' "$salts_version"
            printf 'saltsutils_package=%s\n' "$utils_version"
            sed -n '/^commit=/p' "$salts_manifest" | sed 's/^/salts_/'
            sed -n '/^commit=/p' "$utils_manifest" | sed 's/^/saltsutils_/'
            printf 'sdk_rid=linux-x64\n'
            printf 'sdk_profile=release\n'
          } > build/component-runtime/sdk-graph.txt

          echo "SALTS_ROOT=$salts_root" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$utils_root" >> "$GITHUB_ENV"
          echo "DATABIND_ROOT=$utils_root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$utils_root/lib:$utils_root/bin:$salts_root/lib:$salts_root/bin:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          cat build/component-runtime/sdk-graph.txt

      - name: Configure the complete conformance graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cmake --preset ci-component-release-user

      - name: Build the complete conformance graph
        run: cmake --build --preset ci-component-release-user -j2

      - name: Run Component and adjacent business tests
        run: >-
          ctest --preset ci-component-release-user
          -R '^(scxml_component_test|scxml_component_dso_test|scxml_provider_test|scxml_plugin_test|scxml_test|scxml_event_io_contract_test|scxml_invoke_child_materialization_test|scxml_cnet_ingress_test|scxml_cnet_egress_test)$'
          --no-tests=error --output-on-failure
          --output-junit "$GITHUB_WORKSPACE/build/component-runtime/component-results.xml"

      - name: Install the qualified consumer SDK
        run: cmake --build --preset install-ci-component-release-user -j2

      - name: Verify the installed SDK consumer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: tests/install_consumer
        run: |
          set -euo pipefail
          cmake --preset ci-component-installed-user
          cmake --build --preset ci-component-installed-user -j2
          ctest --preset ci-component-installed-user --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/component-runtime/installed-results.xml"

      - name: Record ccache statistics
        if: always()
        shell: bash
        run: |
          mkdir -p build/component-runtime
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats | tee build/component-runtime/ccache-stats.txt
          else
            printf 'ccache tool unavailable before build\n' > build/component-runtime/ccache-stats.txt
          fi

      - name: Record acceptance identities
        if: always()
        shell: bash
        run: |
          mkdir -p build/component-runtime
          printf 'consumer_commit=%s\n' "$(git rev-parse HEAD)" > build/component-runtime/acceptance.txt
          if [ -f build/component-runtime/sdk-graph.txt ]; then
            cat build/component-runtime/sdk-graph.txt >> build/component-runtime/acceptance.txt
          fi

          printf 'runner_os=%s\nrunner_arch=%s\ncompiler=%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$(gcc -dumpfullversion)" >> build/component-runtime/acceptance.txt

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-acceptance-linux-x64
          path: |
            build/component-runtime/acceptance.txt
            build/component-runtime/sdk-graph.txt
            build/component-runtime/ccache-stats.txt
            build/component-runtime/component-results.xml
            build/component-runtime/installed-results.xml
            build/component-runtime/Testing/Temporary/LastTest.log
            tests/install_consumer/build/component-installed/Testing/Temporary/LastTest.log
